# Visit https://melos.invertase.dev/configuration/overview for more information about this configuration file

name: gynx

packages:
  - apps/**
  - packages/**

command:
  version:
    # # Only allow versioning to happen on main branch.
    # branch: master
    # Additionally build a changelog at the root of the workspace.
    workspaceChangelog: true
  bootstrap:
    usePubspecOverrides:
    # It seems so that running "pub get" in parallel has some issues (like
    # https://github.com/dart-lang/pub/issues/3404). Disabling this feature
    # makes the CI much more stable.
    runPubGetInParallel: false
    environment:
      sdk: ">=3.3.0 <4.0.0"
      flutter: ">=1.17.0"
    dependencies:
      blur: 4.0.0
      collection: 1.18.0
      envied: 1.0.0
      firebase_core: 3.8.0
      firebase_auth: 5.3.3
      firebase_crashlytics: 4.1.5
      firebase_analytics: 11.3.5
      riverpod: 2.6.1
      riverpod_annotation: 2.6.1
      flutter_riverpod: 2.6.1
      flutter_clean_architecture: 6.0.1
      flutter_form_builder: 9.5.0
      flutter_native_splash: 2.4.3
      flutter_platform_alert: 0.6.1
      flutter_smart_dialog: 4.9.8+5
      flutter_platform_widgets: 7.0.1
      flutter_svg: 2.0.16
      form_builder_validators: 11.0.0
      freezed_annotation: 2.4.4
      gap: 3.0.1
      get_it: 8.0.2
      google_fonts: 6.2.1
      google_sign_in: 6.2.2
      go_router: 14.6.1
      iconly: 1.0.1
      icons_plus: 5.0.0
      injectable: 2.5.0
      intl: 0.19.0
      json_annotation: 4.9.0
      loading_animation_widget: 1.3.0
      modal_bottom_sheet: 3.0.0
      supabase_flutter: 2.8.1
      visibility_detector: 0.4.0+2
    dev_dependencies:
      build_runner: 2.4.13
      change_app_package_name: 1.4.0
      envied_generator: 1.0.0
      faker: 2.2.0
      flutter_gen_runner: 5.8.0
      flutter_launcher_icons: 0.14.1
      flutter_lints: 5.0.0
      freezed: 2.5.7
      go_router_builder: 2.7.1
      injectable_generator: 2.6.2
      json_serializable: 6.9.0
      lint: 2.3.0
      lints: 5.0.0
      test: 1.25.7
      mock_supabase_http_client: 0.0.3+1
      mockito: 5.4.4
      pedantic_mono: any
      riverpod_generator: 2.6.3
  ide:
    intellij: true
scripts:
  gen: melos exec --ignore='gynx_l10n' --fail-fast -- "dart run build_runner build --delete-conflicting-outputs"
  gen-l10n: melos exec --scope='gynx_l10n' -- flutter gen-l10n
  fix: melos exec --fail-fast -- "dart fix --apply ."
  format: melos format --ignore='gynx_l10n'
  test: melos exec --fail-fast -- "flutter test"
  supabase-start: supabase start
  supabase-stop: supabase stop
