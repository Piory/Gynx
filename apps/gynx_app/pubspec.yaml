name: gynx_app
version: 0.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: '>=1.17.0'

dependencies:
  basic_utils: 5.7.0
  blur: 4.0.0
  colorful_safe_area: 1.0.0
  cupertino_icons: ^1.0.8
  envied: 1.0.0
#  firebase_analytics: 11.3.5
#  firebase_auth: 5.3.3
#  firebase_core: 3.8.0
#  firebase_crashlytics: 4.1.5
  extended_nested_scroll_view: 6.2.1
  flutter:
    sdk: flutter
  flutter_form_builder: 9.5.0
  flutter_native_splash: 2.4.3
  flutter_platform_alert: 0.6.1
  flutter_platform_widgets: 7.0.1
  flutter_riverpod: 2.6.1
  flutter_smart_dialog: 4.9.8+5
  flutter_svg: 2.0.16
  form_builder_validators: 11.0.0
  freezed_annotation: 2.4.4
  gap: 3.0.1
  get_it: 8.0.2
  go_router: 14.6.1
  google_fonts: 6.2.1
  google_sign_in: 6.2.2
  gynx_components:
    path: ../../packages/gynx_components
  gynx_l10n:
    path: ../../packages/gynx_l10n
  iconly: 1.0.1
  icons_plus: 5.0.0
  image_picker: ^1.1.2
  injectable: 2.5.0
  json_annotation: 4.9.0
  loading_animation_widget: 1.3.0
  modal_bottom_sheet: 3.0.0
  nil: 1.1.1
  riverpod_annotation: 2.6.1
  supabase_flutter: 2.8.1
  uuid: 4.5.1
  visibility_detector: 0.4.0+2
  # path: ^1.8.0

dev_dependencies:
  build_runner: 2.4.13
  change_app_package_name: 1.4.0
  envied_generator: 1.0.0
  faker: 2.2.0
  flutter_gen_runner: 5.8.0
  flutter_launcher_icons: 0.14.1
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter
  freezed: 2.5.7
  go_router_builder: 2.7.1
  injectable_generator: 2.6.2
  json_serializable: 6.9.0
  lints: 5.0.0
  mock_supabase_http_client: 0.0.3+1
  mockito: 5.4.4
  pedantic_mono: any
  riverpod_generator: 2.6.3
  test: 1.25.7

flutter_gen:
  output: lib/src/generated/assets # Optional (default: lib/gen/)
  integrations:
    flutter_svg: true

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/svgs/logos/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_ios: assets/images/app_icon.png
  image_path_ios_dark_transparent: assets/images/app_icon.png
  image_path_android: assets/images/app_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/images/app_icon_android.png
flutter_native_splash:
  color: '#1A1221'
  image: assets/images/splash_logo.png
  branding: assets/images/branding.png
  branding_mode: bottom
  branding_bottom_padding: 48
  color_dark: '#1A1221'
  image_dark: assets/images/splash_logo.png
  branding_dark: assets/images/branding.png
  android_12:
    icon_background_color: '#1A1221'
    image: assets/images/splash_logo_android12.png
    icon_background_color_dark: '#1A1221'
    image_dark: assets/images/splash_logo_android12.png
