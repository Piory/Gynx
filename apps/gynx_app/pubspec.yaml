name: gynx_app
version: 0.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  firebase_analytics: 11.3.5
  firebase_auth: 5.3.3
  firebase_core: 3.8.0
  firebase_crashlytics: 4.1.5
  flutter:
    sdk: flutter
  flutter_clean_architecture: 6.0.1
  flutter_dotenv: 5.2.1
  flutter_form_builder: 9.5.0
  flutter_native_splash: 2.4.3
  flutter_platform_widgets: 7.0.1
  flutter_test:
    sdk: flutter
  form_builder_validators: 11.0.0
  freezed_annotation: 2.4.4
  get_it: 8.0.2
  go_router: 14.6.1
  google_fonts: 6.2.1
  gynx_l10n:
    path: ../../packages/gynx_l10n
  injectable: 2.5.0
  json_annotation: 4.9.0
  modal_bottom_sheet: 3.0.0
  supabase_flutter: 2.8.1
  # path: ^1.8.0

dev_dependencies:
  change_app_package_name: 1.4.0
  flutter_launcher_icons: 0.14.1
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter
  pedantic_mono: any
  build_runner: 2.4.13
  faker: 2.2.0
  freezed: 2.5.7
  go_router_builder: 2.7.1
  injectable_generator: 2.6.2
  json_serializable: 6.9.0
  lints: 5.0.0
  mock_supabase_http_client: 0.0.3+1
  mockito: 5.4.4
  test: 1.25.7

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/.env
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_ios: assets/images/app_icon.png
  image_path_ios_dark_transparent: assets/images/app_icon.png
  image_path_android: assets/images/app_icon.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/app_icon_android.png
flutter_native_splash:
  color: "#1A1221"
  image: assets/images/splash_logo.png
#  branding: assets/images/branding.png
#  branding_bottom_padding: 24
  color_dark: '#1A1221'
  image_dark: assets/images/splash_logo.png
#  branding_dark: assets/images/branding.png
  android_12:
    icon_background_color: "#1A1221"
    image: assets/images/splash_logo_android12.png
    icon_background_color_dark: '#1A1221'
    image_dark: assets/images/splash_logo_android12.png
