name: gynx_app
version: 0.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_dotenv: 5.2.1
  flutter_native_splash: 2.4.3
  gynx_core:
    path: ../../packages/gynx_core

dev_dependencies:
  change_app_package_name: 1.4.0
  flutter_launcher_icons: 0.14.1
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter
  pedantic_mono: any

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/.env
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_ios: assets/images/app_icon.png
  image_path_ios_dark_transparent: assets/images/app_icon.png
  image_path_android: assets/images/app_icon.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/app_icon_android.png
flutter_native_splash:
  color: "#1A1221"
  image: assets/images/splash_logo.png
#  branding: assets/images/branding.png
#  branding_bottom_padding: 24
  color_dark: '#1A1221'
  image_dark: assets/images/splash_logo.png
#  branding_dark: assets/images/branding.png
  android_12:
    icon_background_color: "#1A1221"
    image: assets/images/splash_logo_android12.png
    icon_background_color_dark: '#1A1221'
    image_dark: assets/images/splash_logo_android12.png
