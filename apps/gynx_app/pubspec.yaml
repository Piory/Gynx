name: gynx_app
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ^3.29.1
resolution: workspace

flutter_gen:
  output: lib/src/generated/assets # Optional (default: lib/gen/)
  integrations:
    flutter_svg: true

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/svgs/logos/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path_ios: assets/images/app_icon.png
  image_path_ios_dark_transparent: assets/images/app_icon.png
  image_path_android: assets/images/app_icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/images/app_icon_android.png
flutter_native_splash:
  color: '#1A1221'
  image: assets/images/splash_logo.png
  branding: assets/images/branding.png
  branding_mode: bottom
  branding_bottom_padding: 48
  color_dark: '#1A1221'
  image_dark: assets/images/splash_logo.png
  branding_dark: assets/images/branding.png
  android_12:
    icon_background_color: '#1A1221'
    image: assets/images/splash_logo_android12.png
    icon_background_color_dark: '#1A1221'
    image_dark: assets/images/splash_logo_android12.png
