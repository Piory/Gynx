targets:
  $default:
    builders:
      envied_generator|envied:
        options:
          path: .env
          override: true
      source_gen|combining_builder:
        options:
          build_extensions:
            '^lib/{{}}.dart': 'lib/src/generated/{{}}.g.dart'
      freezed:
        options:
          build_extensions:
            '^lib/{{}}.dart': 'lib/src/generated/{{}}.freezed.dart'
      mockito|mockBuilder:
        generate_for:
          - test/**.dart
          - test_integration/**.dart
